x-runtime: &runtime
  APP_ENV: production
  APP_DEBUG: 'false'
  DB_HOST: db
  DB_PORT: 5432
  DB_USERNAME: citepost_app
  DB_PASSWORD: ${DB_RUNTIME_PASSWORD:?Set DB_RUNTIME_PASSWORD}
  MODEL_SERVICE_URL: http://models:8000
  REDIS_HOST: redis
  REDIS_PORT: 6379
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: database
services:
  db:
    ports: !reset []
    environment:
      DB_RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD}
    mem_limit: 512m
  redis:
    ports: !reset []
    mem_limit: 256m
  models:
    ports: !reset []
  app:
    environment: *runtime
    mem_limit: 512m
  worker:
    environment: *runtime
    mem_limit: 512m
  scheduler:
    environment: *runtime
    mem_limit: 256m
  migrate:
    profiles: [maintenance]
    image: citepost-app:${RELEASE_TAG:-local}
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: citepost
      MODEL_SERVICE_URL: http://models:8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes: ["storage:/var/www/html/storage"]
    command: ["php", "artisan", "migrate", "--force", "--no-interaction"]
  web:
    networks: [default, devpulse]
    labels:
      - traefik.enable=true
      - traefik.docker.network=devpulse
      - traefik.http.routers.citepost.rule=Host(`citepost.syslora.com`)
      - traefik.http.routers.citepost.entrypoints=web
      - traefik.http.routers.citepost.service=citepost
      - traefik.http.routers.citepost.middlewares=citepost-https
      - traefik.http.services.citepost.loadbalancer.server.port=80
      - traefik.http.middlewares.citepost-https.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.citepost-https.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow
    mem_limit: 128m
networks:
  devpulse:
    external: true
