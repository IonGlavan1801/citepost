name: citepost
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: citepost
      POSTGRES_USER: citepost
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-only}
    ports: ["127.0.0.1:5558:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citepost"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6398:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    restart: unless-stopped
  models:
    build: model-service
    ports: ["127.0.0.1:8099:8000"]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    profiles: [app]
    build:
      context: .
      target: app
    image: citepost-app:${RELEASE_TAG:-local}
    env_file: .env
    environment: &runtime
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: citepost
      DB_USERNAME: citepost
      MODEL_SERVICE_URL: http://models:8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: database
    volumes: ["storage:/var/www/html/storage"]
    networks:
      default:
        aliases: [citepost-php]
    depends_on:
      db: {condition: service_healthy}
      models: {condition: service_healthy}
    restart: unless-stopped
  worker:
    profiles: [app]
    image: citepost-app:${RELEASE_TAG:-local}
    env_file: .env
    environment: *runtime
    volumes: ["storage:/var/www/html/storage"]
    command: ["php", "artisan", "horizon"]
    depends_on: [app]
    restart: unless-stopped
  scheduler:
    profiles: [app]
    image: citepost-app:${RELEASE_TAG:-local}
    env_file: .env
    environment: *runtime
    volumes: ["storage:/var/www/html/storage"]
    command: ["php", "artisan", "schedule:work"]
    depends_on: [app]
    restart: unless-stopped
  web:
    profiles: [app]
    build:
      context: .
      target: web
    image: citepost-web:${RELEASE_TAG:-local}
    ports: ["127.0.0.1:${WEB_PORT:-8138}:80"]
    depends_on: [app]
    restart: unless-stopped
volumes:
  database:
  redis:
  storage:
